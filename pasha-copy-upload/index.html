<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パシャコピー</title>
</head>
<body>
<p>パシャコピーは新しいアドレスに移動しました。<a href="../">こちらを開いてください</a>。</p>
<script>
// The app used to live in this folder. Retire its old service worker, then go to the new address.
(async () => {
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.filter(r => r.scope.includes("pasha-copy-upload")).map(r => r.unregister()));
  } catch (e) {}
  location.replace("../");
})();
</script>
</body>
</html>
